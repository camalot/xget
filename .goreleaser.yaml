version: 2

project_name: xget
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

release:
  prerelease: auto
  # XGET_DRY_RUN=true builds everything and writes the package manifests to
  # dist/ without creating a GitHub release or pushing to the tap repos.
  disable: '{{ envOrDefault "XGET_DRY_RUN" "false" }}'

before:
  hooks:
    - go mod tidy

builds:
  - id: xget-windows
    main: ./cmd/xget
    binary: xget
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/camalot/xget/internal/cli.version={{.Version}}
      - -X github.com/camalot/xget/internal/cli.commit={{.ShortCommit}}
      - -X github.com/camalot/xget/internal/cli.date={{.Date}}
    hooks:
      pre:
        - go tool go-winres make --in winres/winres.json --arch={{ .Arch }} --product-version={{ .Version }} --file-version={{ .Version }} --out ./cmd/xget/rsrc

      post:
        - rm -f cmd/xget/rsrc_*.syso
  - id: xget-unix
    main: ./cmd/xget
    binary: xget
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/camalot/xget/internal/cli.version={{.Version}}
      - -X github.com/camalot/xget/internal/cli.commit={{.ShortCommit}}
      - -X github.com/camalot/xget/internal/cli.date={{.Date}}
  - id: xget-android
    main: ./cmd/xget
    binary: xget
    skip: '{{ envOrDefault "XGET_SKIP_ANDROID" "false" }}'
    env:
      - CGO_ENABLED=1
      - CC={{ envOrDefault "ANDROID_NDK_LATEST_HOME" "" }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
      - CXX={{ envOrDefault "ANDROID_NDK_LATEST_HOME" "" }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
    goos:
      - android
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/camalot/xget/internal/cli.version={{.Version}}
      - -X github.com/camalot/xget/internal/cli.commit={{.ShortCommit}}
      - -X github.com/camalot/xget/internal/cli.date={{.Date}}

archives:
  - id: xget
    formats: [zip]
    format_overrides:
      - goos: android
        formats: [tar.gz]
      - goos: linux
        formats: [tar.gz]
      - goos: darwin
        formats: [tar.gz]
    wrap_in_directory: false
    files:
      - README.md
      - LICENSE
      - xget.1

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - id: xget-sbom
    artifacts: archive

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{.ShortCommit}}"

winget:
  - name: xget
    skip_upload: true
    publisher: camalot
    author: Ryan Conrad
    package_name: xget
    package_identifier: camalot.xget
    # Explicit so the manifests can also be rendered with the release pipe disabled.
    url_template: "https://github.com/camalot/xget/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    short_description: xget is a tool for downloading binaries from the GitHub releases.
    description: xget is a tool for downloading binaries from the GitHub releases.
    license: MIT
    commit_msg_template: "chore(winget): update manifest {{ .ProjectName }}@{{ .Version }}"
    license_url: https://github.com/camalot/xget/blob/main/LICENSE
    copyright: "Ryan Conrad"
    release_notes: "{{.Changelog}}"
    tags:
      - installer
      - github
      - cli
      - download
    repository:
      owner: camalot
      name: scoop
      branch: main
      token: '{{ .Env.XGET_APP_TOKEN }}'
    commit_author:
      name: xget-bot
      email: xget-bot@noreply.github.com
# https://goreleaser.com/customization/publish/homebrew_casks/
homebrew_casks:
  - repository:
      owner: camalot
      name: scoop
      branch: main
      token: '{{ .Env.XGET_APP_TOKEN }}'
    skip_upload: '{{ if eq (envOrDefault "XGET_DRY_RUN" "false") "true" }}true{{ else }}auto{{ end }}'
    commit_msg_template: "chore(homebrew): update manifest {{ .ProjectName }}@{{ .Version }}"
    homepage: https://github.com/camalot/xget
    description: xget is a tool for downloading binaries from the GitHub releases.
    url:
      template: "https://github.com/camalot/xget/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    binaries:
      - xget
    manpages:
      - xget.1
    generate_completions_from_executable:
      executable: xget
      args:
        - "completion"
      base_name: xget
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
        - pwsh
    commit_author:
      name: xget-bot
      email: xget-bot@noreply.github.com

# https://goreleaser.com/customization/publish/scoop/
scoops:
  - repository:
      owner: camalot
      name: scoop
      branch: main
      token: '{{ .Env.XGET_APP_TOKEN }}'
    skip_upload: '{{ if eq (envOrDefault "XGET_DRY_RUN" "false") "true" }}true{{ else }}auto{{ end }}'
    url_template: "https://github.com/camalot/xget/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_msg_template: "chore(scoop): update manifest {{ .ProjectName }}@{{ .Version }}"
    homepage: https://github.com/camalot/xget
    description: xget is a tool for downloading binaries from the GitHub releases.
    license: MIT
    commit_author:
      name: xget-bot
      email: xget-bot@noreply.github.com

changelog:
  # if release-notes are passed, then disable generation
  disable: '{{ if ne (envOrDefault "XGET_RELEASE_NOTES" "") "" }}true{{ else }}false{{ end }}'
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
