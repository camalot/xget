---
# Packaging definition for the xget .deb, consumed by .packages/debian/build-deb.sh
# (driven by .github/actions/debian). __VERSION__ and __ARCH__ are substituted at
# build time with the plain (no "v" prefix) release version and the Debian
# architecture name (amd64 / arm64).
#
# Field reference: https://www.debian.org/doc/debian-policy/ch-controlfields.html

# Files installed into the package.
#   path:   absolute install path inside the package
#   source: name of the file inside the extracted release archive (defaults to
#           the basename of `path`)
#   type:   binary | manpage | copyright | doc | config | changelog |
#           lintian-overrides
#           `manpage` and `changelog` files are gzipped (-9n) to `<path>.gz`,
#           `config` files are recorded in DEBIAN/conffiles, and `changelog` /
#           `lintian-overrides` are generated from the `control` fields below
#           rather than copied from the release archive
#   mode:   octal permissions, quoted so YAML keeps it a string
assets:
  - path: /usr/bin/xget
    type: binary
    mode: "0755"
  - path: /usr/share/man/man1/xget.1
    type: manpage
    mode: "0644"
  - path: /usr/share/doc/xget/copyright
    source: LICENSE
    type: copyright
    mode: "0644"
  - path: /usr/share/doc/xget/README.md
    source: README.md
    type: doc
    mode: "0644"
  # required by Debian policy 12.7; generated because the release archive
  # carries a Markdown changelog, not a Debian-format one
  - path: /usr/share/doc/xget/changelog
    type: changelog
    mode: "0644"
  - path: /usr/share/lintian/overrides/xget
    type: lintian-overrides
    mode: "0644"

# Binary package control fields. Scalars are emitted verbatim, lists are joined
# with ", ", and `Installed-Size` is always computed from the staged tree.
control:
  package: xget
  source: xget
  # https://www.debian.org/doc/debian-policy/ch-controlfields.html#version
  version: __VERSION__
  section: utils
  priority: optional
  architecture: __ARCH__
  essential: false
  multi-arch: foreign
  # nothing: the binary is a CGO_ENABLED=0 fully static Go build
  depends: []
  suggests:
    - ca-certificates
  provides:
    - xget
  conflicts:
    - xget-bin
  replaces:
    - xget-bin
  origin: camalot
  # no `bugs` field: it is reserved for Debian BTS infrastructure, and a GitHub
  # issues URL there trips bugs-field-does-not-refer-to-debian-infrastructure
  homepage: https://github.com/camalot/xget
  maintainer: Ryan Conrad <camalot@gmail.com>
  # must not start with the package name and must stay under 80 columns,
  # including the extended description lines below
  summary: download pre-built binaries from GitHub and GitLab releases
  description: |
    Simplifies fetching precompiled binaries from GitHub and GitLab releases,
    ensuring you always get the latest version with minimal effort.

    Particularly useful for developers and system administrators who need to
    quickly obtain the latest versions of software without manually navigating
    release pages.

  # suite and urgency used for the generated Debian changelog entry
  distribution: unstable
  urgency: medium
  # `<package>: <tag>` override lines written to the lintian-overrides asset
  lintian-overrides:
    # Go binaries are statically linked by design (CGO_ENABLED=0)
    - statically-linked-binary
