---
name: Alpine Action
description: Build, sign, install-test, attest, and publish one Alpine platform
inputs:
  version:
    description: Plain release version
    required: true
  architecture:
    description: Release architecture from .packages/platforms.json
    required: true
  token:
    description: GitHub token for release assets
    default: ${{ github.token }}
  packager:
    description: Name and email recorded in the package
    default: "Ryan Conrad <camalot@gmail.com>"
  signing-key-name:
    description: Filename of the abuild RSA key pair
    default: camalot@gmail.com-xget.rsa
  signing-private-key:
    description: PEM private key; generates an ephemeral key when empty
    default: ""
  signing-public-key:
    description: PEM public key matching the private key
    default: ""
  dry-run:
    description: Build and verify without publishing
    default: "true"
  artifact:
    description: Optional workflow artifact containing release archives and checksums
    default: ""
outputs:
  outdir:
    description: Directory containing the package and its checksum
    value: ${{ steps.collect.outputs.outdir }}
runs:
  using: composite
  steps:
    - name: Download and verify release archive
      id: download
      uses: ./.github/actions/release-archives
      with:
        version: ${{ inputs.version }}
        architecture: ${{ inputs.architecture }}
        token: ${{ inputs.token }}
        path: ${{ runner.temp }}/alpine/dl
        artifact: ${{ inputs.artifact }}
    - name: Render APKBUILD
      id: render
      shell: bash
      run: |
        set -euo pipefail
        arch=$(jq -er --arg arch "$RELEASE_ARCH" '.[] | select(.release == $arch) | .alpine // empty' .packages/platforms.json)
        workdir="$RUNNER_TEMP/alpine"
        mkdir -p "$workdir/main/xget" "$workdir/srcdest" "$workdir/packages"
        source="$workdir/srcdest/xget-${VERSION}-${arch}.tar.gz"
        cp "$ARCHIVE" "$source"
        sha512=$(sha512sum "$source" | awk '{print $1}')
        sed -e "s/__VERSION__/$VERSION/g" -e "s/__ARCHITECTURE__/$arch/g" \
          -e "s/__RELEASE_ARCH__/$RELEASE_ARCH/g" -e "s/__SHA512__/$sha512/g" \
          .packages/alpine/APKBUILD > "$workdir/main/xget/APKBUILD"
        {
          echo "arch=$arch"
          echo "workdir=$workdir"
        } >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_ARCH: ${{ inputs.architecture }}
        ARCHIVE: ${{ steps.download.outputs.archive }}
    - name: Set up target Alpine Linux
      uses: jirutka/setup-alpine@v1.4.1
      with:
        arch: ${{ steps.render.outputs.arch }}
        packages: alpine-sdk
        shell-name: alpine.sh
    - name: Build, sign, install, and remove package
      shell: alpine.sh --root {0}
      run: |
        set -eu
        sh .packages/alpine/build-apk.sh
        set -- "$REPODEST/main/$ARCH"/xget-*.apk
        test "$#" -eq 1
        APK_FILE="$1" sh .packages/alpine/verify-apk.sh
      env:
        APKBUILD_DIR: ${{ steps.render.outputs.workdir }}/main/xget
        REPODEST: ${{ steps.render.outputs.workdir }}/packages
        SRCDEST: ${{ steps.render.outputs.workdir }}/srcdest
        PACKAGER: ${{ inputs.packager }}
        SIGNING_KEY_NAME: ${{ inputs.signing-key-name }}
        SIGNING_PRIVATE_KEY: ${{ inputs.signing-private-key }}
        SIGNING_PUBLIC_KEY: ${{ inputs.signing-public-key }}
        VERSION: ${{ inputs.version }}
        ARCH: ${{ steps.render.outputs.arch }}
    - name: Collect package
      id: collect
      shell: bash
      run: |
        set -euo pipefail
        outdir="$WORKDIR/dist"
        mkdir -p "$outdir"
        packages=("$WORKDIR/packages/main/$ARCH"/xget-*.apk)
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        package="$outdir/$(basename "${packages[0]%.apk}")-${ARCH}.apk"
        cp "${packages[0]}" "$package"
        {
          echo "outdir=$outdir"
          echo "package=$package"
        } >> "$GITHUB_OUTPUT"
      env:
        WORKDIR: ${{ steps.render.outputs.workdir }}
        ARCH: ${{ steps.render.outputs.arch }}
    - uses: ./.github/actions/publish-package
      with:
        package: ${{ steps.collect.outputs.package }}
        version: ${{ inputs.version }}
        token: ${{ inputs.token }}
        dry-run: ${{ inputs.dry-run }}
