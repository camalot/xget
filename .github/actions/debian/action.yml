---
name: Debian Action
description: Build, install-test, attest, and publish one supported Debian platform
inputs:
  version:
    description: Plain release version
    required: true
  architecture:
    description: Release architecture from .packages/platforms.json
    required: true
  token:
    description: GitHub token for release assets
    default: ${{ github.token }}
  dry-run:
    description: Build and verify without publishing
    default: "true"
  artifact:
    description: Optional workflow artifact containing release archives and checksums
    default: ""
outputs:
  outdir:
    description: Directory containing the package and its checksum
    value: ${{ steps.build.outputs.outdir }}
runs:
  using: composite
  steps:
    - name: Download and verify release archive
      id: download
      uses: ./.github/actions/release-archives
      with:
        version: ${{ inputs.version }}
        architecture: ${{ inputs.architecture }}
        token: ${{ inputs.token }}
        path: ${{ runner.temp }}/debian
        artifact: ${{ inputs.artifact }}
    - name: Build and inspect Debian package
      id: build
      shell: bash
      run: |
        set -euo pipefail
        platform=$(jq -ce --arg arch "$RELEASE_ARCH" '.[] | select(.release == $arch and .debian != null)' .packages/platforms.json)
        arch=$(jq -r .debian <<< "$platform")
        container=$(jq -r .container <<< "$platform")
        mkdir -p "$WORKDIR/src" "$WORKDIR/dist"
        tar -xzf "$ARCHIVE" -C "$WORKDIR/src"
        package=$(bash .packages/debian/build-deb.sh --version "$VERSION" --arch "$arch" --srcdir "$WORKDIR/src" --outdir "$WORKDIR/dist")
        test "$(dpkg-deb -f "$package" Architecture)" = "$arch"
        dpkg-deb --info "$package"
        dpkg-deb --contents "$package"
        sudo apt-get update -qq
        sudo apt-get install -y -qq lintian
        lintian --tag-display-limit 0 "$package" || true
        expected="$WORKDIR/expected.txt"
        while IFS=$'\t' read -r path type; do
          case "$type" in manpage|changelog) path="${path}.gz" ;; esac
          echo "$path"
        done < <(yq -r '.assets[] | [.path, (.type // "doc")] | join("\t")' .packages/debian/control.yml) > "$expected"
        {
          echo "outdir=$WORKDIR/dist"
          echo "package=$package"
          echo "container=$container"
          echo "expected=$expected"
        } >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_ARCH: ${{ inputs.architecture }}
        ARCHIVE: ${{ steps.download.outputs.archive }}
        WORKDIR: ${{ steps.download.outputs.path }}
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Verify installation and removal
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm --platform "$PLATFORM" -e VERSION \
          -v "$PACKAGE:/tmp/xget.deb:ro" -v "$EXPECTED:/expected.txt:ro" \
          debian:bookworm-slim bash -euc '
            rm -f /etc/dpkg/dpkg.cfg.d/docker
            dpkg --install /tmp/xget.deb
            dpkg --audit
            while read -r path; do test -f "$path"; done < /expected.txt
            xget --version | grep -qF "xget ${VERSION}"
            dpkg --purge xget
            test ! -e /usr/bin/xget
          '
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ steps.build.outputs.container }}
        PACKAGE: ${{ steps.build.outputs.package }}
        EXPECTED: ${{ steps.build.outputs.expected }}
    - uses: ./.github/actions/publish-package
      with:
        package: ${{ steps.build.outputs.package }}
        version: ${{ inputs.version }}
        token: ${{ inputs.token }}
        dry-run: ${{ inputs.dry-run }}