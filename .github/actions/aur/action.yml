---
name: AUR Action
description: Render a multi-platform PKGBUILD and build and publish one pacman package
inputs:
  version:
    description: Plain release version
    required: true
  architecture:
    description: Release architecture from .packages/platforms.json
    required: true
  token:
    description: GitHub token for release assets
    default: ${{ github.token }}
  aur-username:
    description: Username for the AUR commit
    required: true
  aur-email:
    description: Email for the AUR commit
    required: true
  aur-ssh-private-key:
    description: SSH key with AUR repository access
    required: true
  dry-run:
    description: Build and verify without publishing
    default: "true"
  artifact:
    description: Optional workflow artifact containing release archives and checksums
    default: ""
outputs:
  outdir:
    description: Directory containing the package and its checksum
    value: ${{ steps.build.outputs.outdir }}
runs:
  using: composite
  steps:
    - name: Download and verify release archives
      id: download
      uses: ./.github/actions/release-archives
      with:
        version: ${{ inputs.version }}
        token: ${{ inputs.token }}
        path: ${{ runner.temp }}/aur-release
        artifact: ${{ inputs.artifact }}
    - name: Render multi-platform PKGBUILD
      id: render
      shell: bash
      run: |
        set -euo pipefail
        outdir="$RUNNER_TEMP/aur"
        mkdir -p "$outdir"
        architectures=$(jq -r '[.[] | .aur // empty] | join(" ")' .packages/platforms.json)
        : > "$outdir/sources"
        while IFS=$'\t' read -r release arch; do
          archive="xget_${VERSION}_linux_${release}.tar.gz"
          sha256=$(awk -v archive="$archive" '$2 == archive {print $1}' "$CHECKSUMS")
          [[ "$sha256" =~ ^[[:xdigit:]]{64}$ ]]
          printf 'source_%s=("xget-bin-%s-%s.tar.gz::https://github.com/camalot/xget/releases/download/v%s/%s")\n' "$arch" "$VERSION" "$arch" "$VERSION" "$archive" >> "$outdir/sources"
          printf "sha256sums_%s=('%s')\n" "$arch" "$sha256" >> "$outdir/sources"
          cp "$DOWNLOAD/$archive" "$outdir/xget-bin-${VERSION}-${arch}.tar.gz"
        done < <(jq -r '.[] | select(.aur != null) | [.release, .aur] | @tsv' .packages/platforms.json | tr -d '\r')
        tr -d '\r' < .packages/aur/PKGBUILD | \
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__ARCHITECTURES__/$architectures/g" \
            -e "/^__SOURCES__$/r $outdir/sources" -e '/^__SOURCES__$/d' > "$outdir/PKGBUILD"
        arch=$(jq -er --arg arch "$RELEASE_ARCH" '.[] | select(.release == $arch) | .aur // empty' .packages/platforms.json)
        {
          echo "arch=$arch"
          echo "pkgbuild_dir=$outdir"
          echo "pkgbuild_path=$outdir/PKGBUILD"
        } >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_ARCH: ${{ inputs.architecture }}
        CHECKSUMS: ${{ steps.download.outputs.checksums }}
        DOWNLOAD: ${{ steps.download.outputs.path }}
    - name: Build and inspect pacman package
      id: build
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PKGBUILD_DIR:/pkg" -w /pkg -e ARCH \
          -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" archlinux:base-devel bash -euc '
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c "CARCH=$ARCH makepkg --clean --cleanbuild --nodeps --skippgpcheck"
            pacman -Qip /pkg/*.pkg.tar.zst
            pacman -Qlp /pkg/*.pkg.tar.zst
            bsdtar -xOf /pkg/*.pkg.tar.zst .PKGINFO | grep -qx "arch = $ARCH"
            chown -R "${HOST_UID}:${HOST_GID}" /pkg
          '
        outdir="$PKGBUILD_DIR/dist"
        mkdir -p "$outdir"
        packages=("$PKGBUILD_DIR"/*-"$ARCH".pkg.tar.zst)
        test "${#packages[@]}" -eq 1
        test -f "${packages[0]}"
        package="$outdir/$(basename "${packages[0]}")"
        mv "${packages[0]}" "$package"
        {
          echo "outdir=$outdir"
          echo "package=$package"
        } >> "$GITHUB_OUTPUT"
      env:
        PKGBUILD_DIR: ${{ steps.render.outputs.pkgbuild_dir }}
        ARCH: ${{ steps.render.outputs.arch }}
    - uses: ./.github/actions/publish-package
      with:
        package: ${{ steps.build.outputs.package }}
        version: ${{ inputs.version }}
        token: ${{ inputs.token }}
        dry-run: ${{ inputs.dry-run }}
    - name: Publish PKGBUILD to AUR
      if: false
      uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
      with:
        pkgname: xget-bin
        pkgbuild: ${{ steps.render.outputs.pkgbuild_path }}
        commit_username: ${{ inputs.aur-username }}
        commit_email: ${{ inputs.aur-email }}
        ssh_private_key: ${{ inputs.aur-ssh-private-key }}
        commit_message: "xget-bin ${{ inputs.version }}"
        test: true
        ssh_keyscan_types: rsa,ecdsa,ed25519