---
name: RPM Action
description: Build, install-test, attest, and publish one supported RPM platform
inputs:
  version:
    description: Plain release version
    required: true
  architecture:
    description: Release architecture from .packages/platforms.json
    required: true
  token:
    description: GitHub token for release assets
    default: ${{ github.token }}
  dry-run:
    description: Build and verify without publishing
    default: "true"
  artifact:
    description: Optional workflow artifact containing release archives and checksums
    default: ""
outputs:
  outdir:
    description: Directory containing the package and its checksum
    value: ${{ steps.build.outputs.outdir }}
runs:
  using: composite
  steps:
    - name: Download and verify release archive
      id: download
      uses: ./.github/actions/release-archives
      with:
        version: ${{ inputs.version }}
        architecture: ${{ inputs.architecture }}
        token: ${{ inputs.token }}
        path: ${{ runner.temp }}/rpm
        artifact: ${{ inputs.artifact }}
    - uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Build and verify RPM package
      id: build
      shell: bash
      run: |
        set -euo pipefail
        platform=$(jq -ce --arg arch "$RELEASE_ARCH" '.[] | select(.release == $arch and .rpm != null)' .packages/platforms.json)
        rpm_arch=$(jq -r .rpm <<< "$platform")
        container=$(jq -r .container <<< "$platform")
        image=$(jq -r .rpm_image <<< "$platform")
        mkdir -p "$WORKDIR/build/SOURCES" "$WORKDIR/build/SPECS" "$WORKDIR/dist"
        cp "$ARCHIVE" "$WORKDIR/build/SOURCES/"
        sed -e "s/__VERSION__/$VERSION/g" -e "s/__ARCHITECTURE__/$RELEASE_ARCH/g" \
          -e "s/__SHA256__/$SHA256/g" .packages/rpm/xget.spec > "$WORKDIR/build/SPECS/xget.spec"
        docker run --rm --platform "$container" -e VERSION -e RPM_ARCH="$rpm_arch" \
          -v "$WORKDIR:/work" "$image" bash -euc '
            if command -v dnf >/dev/null; then
              dnf install -y rpm-build
            else
              sed -i "s|http://|https://|g" /etc/zypp/repos.d/*.repo
              zypper --non-interactive refresh
              zypper --non-interactive install --no-recommends rpm-build gzip tar
            fi
            rpmbuild -bb --target "$RPM_ARCH" --define "_topdir /work/build" \
              --define "_rpmdir /work/packages" /work/build/SPECS/xget.spec
            package=$(find /work/packages -type f -name "xget-*.rpm")
            test -f "$package"
            test "$(rpm -qp --qf "%{ARCH}" "$package")" = "$RPM_ARCH"
            rpm -qpi "$package"
            rpm -qpl "$package"
            if command -v dnf >/dev/null; then
              dnf install -y "$package"
            else
              zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm "$package"
            fi
            xget --version | grep -qF "xget ${VERSION}"
            rpm -e xget
            test ! -e /usr/bin/xget
          '
        mapfile -t packages < <(find "$WORKDIR/packages" -type f -name 'xget-*.rpm')
        test "${#packages[@]}" -eq 1
        package="$WORKDIR/dist/$(basename "${packages[0]}")"
        cp "${packages[0]}" "$package"
        {
          echo "outdir=$WORKDIR/dist"
          echo "package=$package"
        } >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ inputs.version }}
        RELEASE_ARCH: ${{ inputs.architecture }}
        ARCHIVE: ${{ steps.download.outputs.archive }}
        SHA256: ${{ steps.download.outputs.sha256 }}
        WORKDIR: ${{ steps.download.outputs.path }}
    - uses: ./.github/actions/publish-package
      with:
        package: ${{ steps.build.outputs.package }}
        version: ${{ inputs.version }}
        token: ${{ inputs.token }}
        dry-run: ${{ inputs.dry-run }}