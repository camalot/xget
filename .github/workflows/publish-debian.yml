name: publish debian package

# Builds and publishes the xget .deb packages for a tag that already has a
# GitHub release with the linux binary archives + checksums.txt uploaded.
# Like publish-aur.yml, this doesn't rebuild anything at that tag's commit: the
# packages are repacked from the release's existing archives using the *current*
# main branch's packaging definition (.packages/debian/control.yml).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish the Debian package for (e.g. v2.2.0)
        required: true
        type: string
      dry-run:
        description: 'Dry-Run: build the .deb packages without attesting or uploading them'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish the Debian package for (e.g. v2.2.0)
        required: true
        type: string
      dry-run:
        description: Whether to only build the .deb packages
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  debian:
    permissions:
      # attach the built packages/checksums/SBOMs to the release
      contents: write
      # sign and publish the build provenance and SBOM attestations
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # deliberately not checked out at inputs.tag: the package only needs
      # today's packaging/action definition, not that tag's source tree
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Verify release assets exist
        id: verify-release-asset
        uses: ./.github/actions/verify-release-asset
        with:
          token: ${{ github.token }}
          tag: ${{ inputs.tag }}
          platform: linux
          architecture: |
            amd64
            arm64

      - name: Build, attest, and publish the Debian packages
        uses: ./.github/actions/debian
        with:
          version: ${{ steps.verify-release-asset.outputs.version }}
          dry-run: ${{ inputs.dry-run || 'false' }}
