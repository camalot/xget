name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry-Run: Render manifests/build artifacts without creating a tag, release, changelog commit, or pushing to the tap repo'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for goreleaser's changelog generation
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - uses: ./.github/actions/verify-sha256


  version:
    permissions:
      contents: read
      statuses: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      ver_major_minor_patch: ${{ steps.get.outputs.major_minor_patch }}
      ver_major_minor: ${{ steps.get.outputs.major_minor }}
      ver_major: ${{ steps.get.outputs.major }}
      tag: ${{ steps.get.outputs.tag_major_minor_patch }}
      tag_major: ${{ steps.get.outputs.tag_major }}
      tag_major_minor: ${{ steps.get.outputs.tag_major_minor }}
      tag_major_minor_patch: ${{ steps.get.outputs.tag_major_minor_patch }}
    needs:
      - verify
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Determine next version
        id: get
        uses: camalot/actions/version/get@v1
        with:
          default_version: v1.0.0
          fail_on_default: true
          fail_on_same_version: true
          token: ${{ github.token }}

  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs:
      - verify
      - version
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: xget-bot-token
        with:
          client-id: ${{ vars.XGET_APP_CLIENT_ID }}
          # installation-id: ${{ vars.XGET_APP_INSTALL_ID }}
          private-key: ${{ secrets.XGET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # the app installation must also have access to camalot/scoop (winget/scoop/homebrew manifests)
          repositories: |
            xget
            scoop
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # setup git using gh
      - name: Setup git
        run: |
          gh auth setup-git
          git config --global user.name "xget-bot[bot]"
          git config --global user.email "325102936+xget-bot[bot]@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ steps.xget-bot-token.outputs.token }}

      # - name: Install pandoc
      #   run: sudo apt-get update && sudo apt-get install -y pandoc
      - uses: camalot/xget-action@v1
        with:
          token: ${{ steps.xget-bot-token.outputs.token }}
          package: jgm/pandoc
          asset-filters: ".tar.gz"

      - uses: camalot/xget-action@v1
        with:
          token: ${{ steps.xget-bot-token.outputs.token }}
          package: orhun/git-cliff
          asset-filters: "gnu.tar.gz"
          file-filter: "git-cliff"
          ignore: ".sha512,.sha256,.sig,.sbom.json"

      - shell: bash
        run: |
          set -euo pipefail

          # write outside the repo so the untracked file doesn't trip goreleaser's dirty-git check
          git-cliff --github-token "${GH_TOKEN}" --unreleased --tag "${GC_TAG}" --prepend CHANGELOG.md --output "${RUNNER_TEMP}/RELEASE_NOTES.md"

          # add the docs/_includes/_install.md to the release notes
          echo -e "\n\### Install Instructions\n" >> "${RUNNER_TEMP}/RELEASE_NOTES.md"

          # we need to replace <VERSION> with the actual version in the install instructions
          sed "s/<VERSION>/${GC_TAG#v}/g" docs/_includes/_install.md >> "${RUNNER_TEMP}/RELEASE_NOTES.md"

          # send the release notes to the GITHUB_SUMMARY
          echo "### Release Notes for ${GC_TAG}" >> $GITHUB_STEP_SUMMARY
          cat "${RUNNER_TEMP}/RELEASE_NOTES.md" >> $GITHUB_STEP_SUMMARY

          echo "XGET_RELEASE_NOTES=1" >> $GITHUB_ENV

          if [[ "${DRY_RUN}" == "true" ]]; then
            # goreleaser reads the tag's contents via `git tag`, so it needs a local tag even
            # though nothing is committed/pushed in a dry run
            echo "Dry run: creating local-only tag ${GC_TAG} for goreleaser (not pushing)"
            git tag -a "${GC_TAG}" -m "docs: update changelog for ${GC_TAG}"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${GC_TAG}"
          echo "CHANGELOG_COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git push origin HEAD
          git tag -a "${GC_TAG}" -m "docs: update changelog for ${GC_TAG}"
          git push origin "${GC_TAG}"
          echo "Release notes for ${GC_TAG} have been committed and tagged."

        env:
          GH_TOKEN: ${{ steps.xget-bot-token.outputs.token }}
          GC_TAG: ${{ needs.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}

      - name: Generate man page
        run: pandoc docs/_man/xget.md -s -t man -o xget.1

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Prepare GoReleaser arguments
        id: goreleaser-args
        shell: bash
        run: |
          args="release --clean"

          if [[ "${XGET_RELEASE_NOTES:-}" == "1" ]]; then
            release_notes="${RUNNER_TEMP}/RELEASE_NOTES.md"
            if [[ ! -f "${release_notes}" ]]; then
              echo "Release notes file not found: ${release_notes}" >&2
              exit 1
            fi
            args+=" --release-notes ${release_notes}"
          fi

          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=" --skip=validate,announce,sign"
          fi

          echo "args=${args}" >> "$GITHUB_OUTPUT"
        env:
          DRY_RUN: ${{ inputs.dry-run }}

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          distribution: goreleaser
          version: latest
          args: ${{ steps.goreleaser-args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XGET_APP_TOKEN: ${{ steps.xget-bot-token.outputs.token }}
          XGET_BOT_NAME: ${{ vars.XGET_APP_USERNAME }}
          XGET_BOT_EMAIL: ${{ vars.XGET_APP_USEREMAIL }}
          # the tag isn't created/pushed in a dry run, so goreleaser can't discover it via `git describe`
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
          XGET_DRY_RUN: ${{ inputs.dry-run }}

      - name: Upload packaging manifests
        if: ${{ inputs.dry-run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: packaging-manifests
          path: |
            dist/scoop/**
            dist/homebrew/**
            dist/winget/**
            dist/checksums.txt
          if-no-files-found: error

      - uses: actions/attest-build-provenance@v4
        if: ${{ inputs.dry-run != true }}
        with:
          subject-path: "dist/*.zip,dist/*.tar.gz,dist/checksums.txt"

      # if anything after the tag was pushed fails, don't leave a dangling tag/release or changelog commit behind
      - name: Rollback tag/release/changelog on failure
        if: ${{ failure() && inputs.dry-run != true }}
        run: |
          set -uo pipefail
          echo "Rolling back ${GC_TAG} due to workflow failure"
          gh release delete "${GC_TAG}" --cleanup-tag --yes || git push origin --delete "${GC_TAG}" || true

          if [[ -n "${CHANGELOG_COMMIT_SHA}" ]]; then
            echo "Reverting changelog commit ${CHANGELOG_COMMIT_SHA}"
            git revert --no-edit "${CHANGELOG_COMMIT_SHA}"
            git push origin HEAD
          fi
        env:
          GH_TOKEN: ${{ steps.xget-bot-token.outputs.token }}
          GC_TAG: ${{ needs.version.outputs.tag }}
          CHANGELOG_COMMIT_SHA: ${{ env.CHANGELOG_COMMIT_SHA }}

  chocolatey:
    permissions:
      contents: read
    # choco pack requires the Chocolatey CLI, which is only preinstalled on windows runners
    runs-on: windows-latest
    needs:
      - version
      - release
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: xget-bot-token
        with:
          client-id: ${{ vars.XGET_APP_CLIENT_ID }}
          installation-id: ${{ vars.XGET_APP_INSTALL_ID }}
          private-key: ${{ secrets.XGET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            scoop
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Pack and push Chocolatey package
        uses: ./.github/actions/chocolatey
        with:
          token: ${{ steps.xget-bot-token.outputs.token }}
          # nupkg/nuspec versions can't have a "v" prefix, unlike the git tag
          version: ${{ needs.version.outputs.ver_major_minor_patch }}
          dry-run: ${{ inputs.dry-run }}
          chocolatey-api-key: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Upload Chocolatey package
        if: ${{ inputs.dry-run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: chocolatey-package
          path: dist/chocolatey/**
          if-no-files-found: error

  aur:
    permissions:
      # attach the built packages/checksums/SBOMs to the release
      contents: write
      # sign and publish the build provenance and SBOM attestations
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs:
      - version
      - release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Render, build, attest, and publish the AUR package
        uses: ./.github/actions/aur
        with:
          # AUR pkgver can't have a "v" prefix, unlike the git tag
          version: ${{ needs.version.outputs.ver_major_minor_patch }}
          dry-run: ${{ inputs.dry-run }}
          aur-username: ${{ secrets.AUR_USERNAME }}
          aur-email: ${{ secrets.AUR_EMAIL }}
          aur-ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  debian:
    permissions:
      # attach the built packages/checksums/SBOMs to the release
      contents: write
      # sign and publish the build provenance and SBOM attestations
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs:
      - version
      - release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Build, attest, and publish the Debian packages
        id: debian
        uses: ./.github/actions/debian
        with:
          # deb versions can't have a "v" prefix, unlike the git tag
          version: ${{ needs.version.outputs.ver_major_minor_patch }}
          dry-run: ${{ inputs.dry-run }}

      - name: Upload Debian packages
        if: ${{ inputs.dry-run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: |
            ${{ steps.debian.outputs.outdir }}/*.deb
            ${{ steps.debian.outputs.outdir }}/debian-checksums.txt
          if-no-files-found: error

  alpine:
    permissions:
      # attach the built packages/checksums/SBOMs to the release
      contents: write
      # sign and publish the build provenance and SBOM attestations
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs:
      - version
      - release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Build, verify, attest, and publish the Alpine packages
        id: alpine
        uses: ./.github/actions/alpine
        with:
          # apk pkgver can't have a "v" prefix, unlike the git tag
          version: ${{ needs.version.outputs.ver_major_minor_patch }}
          dry-run: ${{ inputs.dry-run }}
          signing-private-key: ${{ secrets.RSA_PRIVATE_KEY }}
          signing-public-key: ${{ vars.RSA_PUBLIC_KEY }}

      - name: Upload Alpine packages
        if: ${{ inputs.dry-run == true }}
        uses: actions/upload-artifact@v7
        with:
          name: alpine-packages
          path: |
            ${{ steps.alpine.outputs.outdir }}/*.apk
            ${{ steps.alpine.outputs.outdir }}/alpine-checksums.txt
          if-no-files-found: error

  publish-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: write
      id-token: write
    needs:
      - release
      - version
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dr. Jekyll Build
        uses: camalot/actions/docs/drjekyll@v1
        with:
          input_dir: ./docs
          output_dir: ./_site
          jekyll_env: production
          token: ${{ github.token }}