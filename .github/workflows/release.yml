name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        default: "1.0.0"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate man page
        run: pandoc docs/_man/xget.md -s -t man -o xget.1

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.zip,dist/*.tar.gz,dist/checksums.txt"
