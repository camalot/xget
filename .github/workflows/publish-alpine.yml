name: publish alpine package

# Builds and publishes the xget apk packages for a tag that already has a
# GitHub release with the linux binary archives + checksums.txt uploaded.
# Like publish-aur.yml / publish-debian.yml, this doesn't rebuild anything at
# that tag's commit: the packages are repacked from the release's existing
# archives using the *current* main branch's packaging definition
# (.packages/alpine/APKBUILD).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish the Alpine package for (e.g. v2.2.0)
        required: true
        type: string
      dry-run:
        description: 'Dry-Run: build and test-install the apk packages without attesting or uploading them'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish the Alpine package for (e.g. v2.2.0)
        required: true
        type: string
      dry-run:
        description: Build and test-install without publishing
        required: false
        type: boolean
        default: true
    secrets:
      RSA_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  platforms:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: platforms
        uses: ./.github/actions/package-platforms
        with:
          format: alpine

  alpine:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    permissions:
      # attach the built packages/checksums/SBOMs to the release
      contents: write
      # sign and publish the build provenance and SBOM attestations
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # deliberately not checked out at inputs.tag: the package only needs
      # today's packaging/action definition, not that tag's source tree
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      - name: Verify release assets exist
        id: verify-release-asset
        uses: ./.github/actions/verify-release-asset
        with:
          tag: ${{ inputs.tag }}
          platform: linux
          architecture: ${{ matrix.platform.release }}
          token: ${{ github.token }}

      - name: Build, verify, attest, and publish the Alpine packages
        uses: ./.github/actions/alpine
        with:
          version: ${{ steps.verify-release-asset.outputs.version }}
          architecture: ${{ matrix.platform.release }}
          dry-run: ${{ inputs.dry-run }}
          signing-private-key: ${{ secrets.RSA_PRIVATE_KEY }}
          signing-public-key: ${{ vars.RSA_PUBLIC_KEY }}
