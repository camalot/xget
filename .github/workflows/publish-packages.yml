name: publish packages

# Manually re-runs only the winget/scoop/homebrew cask publish pipes for a tag
# that already has a GitHub release (e.g. because that step failed on the
# initial run). Rebuilds the archives locally so checksums match what's
# already uploaded, but skips creating/updating the GitHub release itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish package manifests for (e.g. v2.0.1)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0 # goreleaser's changelog needs full history
          persist-credentials: false # avoid exposing GITHUB_TOKEN to submodules

      # the tag's own .goreleaser.yaml is frozen at whatever it was when that
      # release was cut - pull today's version so packaging-only fixes (e.g. the
      # XGET_SKIP_GITHUB_RELEASE toggle below) apply even to older tags,
      # while still building from the tag's actual source for matching checksums
      - name: Use current .goreleaser.yaml
        run: git show "${GITHUB_SHA}:.goreleaser.yaml" > .goreleaser.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: camalot/xget-action@v1
        with:
          package: jgm/pandoc
          asset-filters: ".tar.gz"

      - name: Generate man page
        run: pandoc docs/_man/xget.md -s -t man -o xget.1

      - uses: anchore/sbom-action/download-syft@v0

      - uses: actions/create-github-app-token@v3.2.0
        id: xget-bot-token
        with:
          client-id: ${{ vars.XGET_APP_CLIENT_ID }}
          installation-id: ${{ vars.XGET_APP_INSTALL_ID }}
          private-key: ${{ secrets.XGET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # the app installation must also have access to camalot/scoop (winget/scoop/homebrew manifests)
          repositories: |
            xget
            scoop
          permission-contents: write

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          distribution: goreleaser
          version: latest
          # XGET_SKIP_GITHUB_RELEASE (below) leaves the already-published GitHub
          # release/assets alone - goreleaser has no standalone `--skip=github`
          args: release --clean --skip=validate,announce,sign,sbom
        env:
          GITHUB_TOKEN: ${{ steps.xget-bot-token.outputs.token }}
          XGET_APP_TOKEN: ${{ steps.xget-bot-token.outputs.token }}
          XGET_BOT_NAME: ${{ vars.XGET_APP_USERNAME }}
          XGET_BOT_EMAIL: ${{ vars.XGET_APP_USEREMAIL }}
          XGET_SKIP_GITHUB_RELEASE: 'true'
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

  chocolatey:
    permissions:
      contents: read
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
