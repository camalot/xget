name: publish rpm package

# Builds and publishes the xget RPM package for a tag that already has a
# GitHub release with the Linux binary archive and checksums.txt uploaded.
# Like publish-aur.yml / publish-alpine.yml / publish-debian.yml, it repacks
# the existing release binary using the current RPM packaging definition.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish the RPM package for (e.g. v2.2.0)
        required: true
        type: string
      dry-run:
        description: 'Dry-Run: build and inspect the RPM packages without attesting or uploading them'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish the RPM package for (e.g. v2.2.0)
        required: true
        type: string
      dry-run:
        description: Whether to only build and inspect the RPM packages
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  rpm:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release assets exist
        id: verify-release-asset
        uses: ./.github/actions/verify-release-asset
        with:
          token: ${{ github.token }}
          tag: ${{ inputs.tag }}
          platform: linux
          architecture: |
            amd64
            arm64
      - name: Build, verify, attest, and publish the RPM packages
        uses: ./.github/actions/rpm
        with:
          version: ${{ steps.verify-release-asset.outputs.version }}
          dry-run: ${{ inputs.dry-run || 'false' }}