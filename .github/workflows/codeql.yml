---
name: codeql

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for codeql's changelog generation
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: camalot/actions/smells/codeql@v1
        with:
          language: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
